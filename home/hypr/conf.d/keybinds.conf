$mainMod = SUPER

unbind = $mainMod, RETURN
unbind = $mainMod, SPACE
unbind = $mainMod, C
unbind = $mainMod, W
unbind = $mainMod, B
unbind = $mainMod, E
unbind = $mainMod, J

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, SPACE, exec, pkill -x .wofi-wrapped || wofi --show drun
bind = $mainMod, W, killactive,
bind = $mainMod, B, exec, google-chrome
bind = $mainMod, E, exec, kitty --title yazi -e yazi
bind = $mainMod, L, exec, hyprlock
bind = $mainMod CTRL, V, exec, ~/.config/hypr/scripts/clipboard-menu.sh
bind = $mainMod SHIFT, E, exec, ~/.config/hypr/scripts/session-menu.sh
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = , Print, exec, ~/.config/hypr/scripts/screenshot-copy.sh full
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/screenshot-copy.sh area

bind = $mainMod, left, workspace, e-1
bind = $mainMod, right, workspace, e+1
bind = $mainMod ALT, left, movetoworkspace, e-1
bind = $mainMod ALT, right, movetoworkspace, e+1

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bind = $mainMod CTRL, left, movewindow, l
bind = $mainMod CTRL, right, movewindow, r
bind = $mainMod CTRL, up, movewindow, u
bind = $mainMod CTRL, down, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod SHIFT, mouse:272, resizewindow

binde = $mainMod SHIFT, right, resizeactive, 20 0
binde = $mainMod SHIFT, left, resizeactive, -20 0
binde = $mainMod SHIFT, up, resizeactive, 0 -20
binde = $mainMod SHIFT, down, resizeactive, 0 20
